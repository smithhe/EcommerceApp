name: 'Merge Into Dev'

# Trigger the action on push to dev
on:
  push:
    branches: [ "dev" ]

jobs:
  Build-And-Push-Api-Image:
    name: Build Api Image
    runs-on: ubuntu-latest
    steps:
      # Step 1: Get the source
      - name: Get the sources
        uses: actions/checkout@v4

      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: smithhe95
          password: ${{ secrets.DOCKERHUB_ACCESSTOKEN }}

      # Step 3: Setup CakeBuild
      - name: Setup Cake
        run: |
          dotnet tool install Cake.Tool --version 5.0.0

      # Step 4: Build and Push the API Image
      - name: Build and Push Api Image
        run: |
          dotnet cake ./BuildFiles/build.cake --build=API --target='Docker Push' --configuration=Release --dockerWorkingDirectory=${{ github.workspace }}
  
  Build-And-Push-UI-Image:
    name: Build UI Image
    runs-on: ubuntu-latest
    steps:
      # Step 1: Get the source
      - name: Get the sources
        uses: actions/checkout@v4

      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: smithhe95
          password: ${{ secrets.DOCKERHUB_ACCESSTOKEN }}

      # Step 3: Setup CakeBuild
      - name: Setup Cake
        run: |
          dotnet tool install Cake.Tool --version 5.0.0

      # Step 4: Build and Push the UI Image
      - name: Build and Push UI Image
        run: |
          dotnet cake ./BuildFiles/build.cake --build=UI --target='Docker Push' --configuration=Release --environmentArg=QA --dockerWorkingDirectory=${{ github.workspace }}
  
  Build-And-Push-Worker-Image:
    name: Build Worker Image
    runs-on: ubuntu-latest
    steps:
      # Step 1: Get the source
      - name: Get the sources
        uses: actions/checkout@v4

      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: smithhe95
          password: ${{ secrets.DOCKERHUB_ACCESSTOKEN }}

      # Step 3: Setup CakeBuild
      - name: Setup Cake
        run: |
          dotnet tool install Cake.Tool --version 5.0.0

      # Step 4: Build and Push the Worker Image
      - name: Build and Push Worker Image
        run: |
          dotnet cake ./BuildFiles/build.cake --build=Worker --target='Docker Push' --configuration=Release --dockerWorkingDirectory=${{ github.workspace }}
